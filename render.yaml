# Render service definition.
#
# 2026-07-25 — THE BLOFIN CREDENTIALS ARE GONE FROM THIS SERVICE.
#
# Wallace was demo trading on BloFin himself and the bot closed his trade.
# That account is his now. Removing the three BloFin variables here means the
# worker cannot reach it even if some old code path tried — there are simply
# no keys in the environment to authenticate with. That is a stronger
# guarantee than a flag in the source, because it survives a bad deploy, a
# rollback, or a forgotten import.
#
# The new build trades ALPACA PAPER (see step435_venue_decision.md). Its two
# keys are marked `sync: false`, which means Render asks for the value in the
# dashboard instead of reading it from this file — secrets never belong in a
# repo.

services:
  - type: worker
    name: cryptobot-daemon
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # daemon.py currently idles on purpose — it is the retired BloFin loop.
    # This flips to the new Alpaca runner the moment tjr_bot.py is finished.
    startCommand: python -u daemon.py

    # ------------------------------------------------------------------
    # WHY THIS EXISTS: the bot was restarting all day and it looked like
    # Render being unreliable. It was not. On 25 July it redeployed TEN
    # times between 14:08 and 17:01 — and half of those were commits
    # titled "journal update [skip ci]".
    #
    # `[skip ci]` is a GitHub Actions convention. RENDER DOES NOT HONOUR
    # IT. Render sees any commit on the branch and rebuilds. So a bot
    # writing notes to a markdown file was tearing down the trading bot,
    # reinstalling every dependency, and restarting it — over and over.
    #
    # Every restart is dead time. For a strategy that lives inside a
    # forty-minute window each morning, a restart at the wrong moment is
    # a missed day, and it would have looked like the bot simply chose
    # not to trade.
    #
    # So: only redeploy when code the bot actually runs has changed.
    # Research scripts, results, notes, transcripts, cached prices and
    # the journal all change constantly and none of them affect the
    # running process.
    # ------------------------------------------------------------------
    buildFilter:
      ignoredPaths:
        - "**/*.md"                 # notes, results, specs, the journal
        - "step*.py"                # research rounds, never imported live
        - "step*.csv"
        - "test_*.py"               # tests run here, not on the worker
        - "data_*.parquet"          # cached prices, fetched not deployed
        - "tjr_transcripts/**"
        - "dashboard/**"            # the static site, its own service
        - "journal/**"
        - "*.log"
    envVars:
      - key: CRYPTOBOT_SUPABASE_URL
        value: https://gpgjujfkktxghqeqvrvh.supabase.co
      - key: CRYPTOBOT_SUPABASE_ANON
        sync: false
      - key: CRYPTOBOT_STATE_SECRET
        sync: false

      # STOCKS — Alpaca paper. SPY and QQQ. No funded account behind these.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false

      # CRYPTO — BloFin demo. Restored 2026-07-25 on Wallace's instruction:
      # "lets do stocks with alpaca on trading view and crypto on blofin,
      #  both ran by api."
      #
      # These were removed a few hours earlier, after the OLD bot closed a
      # trade Wallace had opened himself on this account. That must not
      # happen again, and removing the keys is no longer what prevents it —
      # ATTRIBUTION is:
      #
      #   The bot may only ever touch a position it opened itself. Every
      #   order carries our tag (blofin_private.make_client_order_id). Any
      #   position without our tag is invisible to it: not reconciled, not
      #   counted, not closed, not tidied up. Anything it cannot positively
      #   attribute to itself is HIS, and ambiguity always resolves to hands
      #   off. A test fails the build if any close or reduce path can run
      #   without that check.
      #
      # That is what lets him trade this same demo account alongside the bot.
      - key: BLOFIN_DEMO_API_KEY
        sync: false
      - key: BLOFIN_DEMO_API_SECRET
        sync: false
      - key: BLOFIN_DEMO_PASSPHRASE
        sync: false

  - type: web
    name: cryptobot-pnl
    runtime: static
    buildCommand: ""
    staticPublishPath: ./dashboard
