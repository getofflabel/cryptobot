<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cryptobot · PnL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f14'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%2334d399' font-family='Arial'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-0: #090b10;
    --bg-1: #0d0f16;
    --bg-2: #11141c;
    --card-bg: rgba(255,255,255,0.035);
    --card-bg-hover: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.085);
    --text-1: #eef0f5;
    --text-2: #98a0b3;
    --text-3: #5c6377;
    --accent: #4d8dff;
    --accent-soft: rgba(77,141,255,0.16);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.14);
    --red: #f87171;
    --red-soft: rgba(248,113,113,0.14);
    --gold: #f4c15c;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(77,141,255,0.10), transparent 60%),
      radial-gradient(700px 460px at 100% 0%, rgba(52,211,153,0.07), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    background-attachment: fixed;
  }

  .tabular { font-variant-numeric: tabular-nums; }

  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 28px 64px;
  }

  /* ---------- header ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .brand-mark .sep { color: var(--text-3); margin: 0 2px; font-weight: 500; }
  .brand-mark .accent { color: var(--accent); }

  .live-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(52,211,153,0.5);
    animation: pulse 2s infinite;
    flex: none;
  }
  .live-dot.down { background: var(--red); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.neutral { color: var(--text-1); }

  .goal-bar-track {
    margin-top: 14px;
    height: 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
  }
  .goal-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--accent), #7db4ff);
    transition: width 0.6s ease;
  }
  .goal-text {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  .equity-composition {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-3);
  }
  .equity-composition .k { color: var(--text-2); }

  .pnl-card-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .pnl-card-left { min-width: 0; flex: 1; }
  .pnl-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  #sparkline {
    width: 130px;
    height: 52px;
    flex: none;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:hover { color: var(--text-1); }
  .tab.active { background: var(--accent-soft); color: #bcd4ff; }

  .view-toggle {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
  }
  .view-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .view-btn:hover { color: var(--text-1); }
  .view-btn.active { background: rgba(255,255,255,0.09); color: var(--text-1); }

  /* ---------- grid / cards ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 18px 18px 16px;
    cursor: pointer;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    outline: none;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    background: var(--card-bg-hover);
    border-color: rgba(255,255,255,0.16);
    box-shadow: 0 14px 34px rgba(0,0,0,0.38);
  }
  .card:active { transform: translateY(-1px); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex: none;
  }
  .card-heading { min-width: 0; flex: 1; }
  .card-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 6px;
    flex: none;
  }
  .chip-open {
    background: var(--accent-soft);
    color: #bcd4ff;
    animation: chip-pulse 2.4s infinite;
  }
  @keyframes chip-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* small, unobtrusive "paper" tag — never a separate section, never a
     disclaimer wall, just enough that an internal-ledger dollar is never
     mistaken for a real BloFin dollar */
  .tag-paper {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-3);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: middle;
  }

  .card-pnl {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .card-pnl.pos { color: var(--green); }
  .card-pnl.neg { color: var(--red); }
  .card-pnl.neutral { color: var(--text-2); }

  .card-meta {
    font-size: 12px;
    color: var(--text-2);
  }
  .card-meta .dot { margin: 0 6px; color: var(--text-3); }

  .card-empty {
    font-size: 12.5px;
    color: var(--text-3);
    font-style: italic;
  }

  /* ---------- drawer ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4,5,8,0.55);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 40;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(420px, 100vw);
    background: #0c0e14;
    border-left: 1px solid var(--card-border);
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    transform: translateX(100%);
    transition: transform 0.26s cubic-bezier(.2,.8,.25,1);
    z-index: 41;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--card-border);
    flex: none;
  }
  .drawer-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex: none;
  }
  .drawer-titlewrap { min-width: 0; flex: 1; }
  .drawer-title { font-size: 16px; font-weight: 700; }
  .drawer-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .drawer-close {
    appearance: none;
    border: none;
    background: rgba(255,255,255,0.05);
    color: var(--text-2);
    width: 30px; height: 30px;
    border-radius: 9px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }
  .drawer-close:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }

  .drawer-list {
    overflow-y: auto;
    padding: 10px 16px 24px;
    flex: 1;
  }

  .trow {
    padding: 13px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.055);
  }
  .trow:last-child { border-bottom: none; }
  .trow-open { background: rgba(77,141,255,0.05); border-radius: var(--r-sm); }

  .trow-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 12px;
  }
  .trow-side {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 5px;
    color: #fff;
    flex: none;
  }
  .trow-side.long { background: #0f7a53; }
  .trow-side.short { background: #a6303a; }
  .trow-book {
    color: var(--text-2);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trow-time {
    margin-left: auto;
    color: var(--text-3);
    flex: none;
    white-space: nowrap;
  }

  .trow-prices {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
  }
  .trow-price { font-variant-numeric: tabular-nums; color: var(--text-1); }
  .trow-price .arrow { color: var(--text-3); margin: 0 6px; }
  .trow-price .live-tag {
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .trow-pnl {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .trow-pnl.pos { color: var(--green); }
  .trow-pnl.neg { color: var(--red); }
  .trow-pnl.neutral { color: var(--text-2); }

  .trow-headline {
    margin-top: 7px;
    font-size: 12px;
    font-style: italic;
    color: var(--text-2);
    line-height: 1.4;
  }

  .drawer-empty {
    padding: 40px 12px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    font-style: italic;
  }

  /* ---------- paper desk ---------- */

  .paper-section { margin-top: 32px; }

  .paper-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .paper-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-1);
  }
  .paper-title-sub {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .paper-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
  }
  .paper-tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .paper-tab:hover { color: var(--text-1); }
  .paper-tab.active { background: var(--accent-soft); color: #bcd4ff; }

  .paper-market { display: flex; flex-direction: column; gap: 14px; }

  .paper-chart-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 16px 16px 10px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .paper-chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .paper-chart-name { font-size: 13.5px; font-weight: 700; color: var(--text-1); }

  /* ---- timeframe strip: Time · 5m · 15m · 1H · 4H · 1D ---- */
  .paper-tf-strip {
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    padding: 3px;
  }
  .paper-tf-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0 6px 0 4px;
  }
  .paper-tf-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .paper-tf-btn:hover { color: var(--text-1); }
  .paper-tf-btn.active { background: var(--accent-soft); color: #bcd4ff; }
  .paper-tf-btn.stale::after { content: ' \00B7'; color: var(--gold); }

  /* ---- market header row: last price · 24h change · hi/lo · as-of ---- */
  .paper-market-header {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .paper-mh-last {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .paper-mh-change { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .paper-mh-change.pos { color: var(--green); }
  .paper-mh-change.neg { color: var(--red); }
  .paper-mh-change.neutral { color: var(--text-3); }
  .paper-mh-stat { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .paper-mh-stat .v { color: var(--text-2); }
  .paper-mh-asof { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .paper-mh-asof.stale { color: var(--gold); }

  .paper-chart-svg { width: 100%; height: auto; display: block; }
  .paper-chart-empty {
    padding: 46px 12px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    font-style: italic;
  }

  .paper-books-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 14px;
  }

  .paper-book-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 16px 18px 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .paper-book-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 12px;
  }
  .paper-book-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-1);
  }
  .paper-book-name .tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-3);
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .paper-book-ledger {
    font-size: 12px;
    color: var(--text-2);
    text-align: right;
  }
  .paper-book-ledger .val { color: var(--text-1); font-weight: 700; }
  .paper-book-record {
    font-size: 11px;
    color: var(--text-3);
    text-align: right;
    margin-top: 1px;
  }

  .paper-flat {
    padding: 22px 8px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    font-style: italic;
    border: 1px dashed var(--card-border);
    border-radius: var(--r-md);
    margin-bottom: 14px;
  }

  /* ---- assets row: Equity · Floating PnL · In use ---- */
  .paper-assets-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .paper-asset-chip {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--card-border);
    border-radius: var(--r-sm);
    padding: 7px 10px;
  }
  .paper-asset-label {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-3);
    margin-bottom: 2px;
  }
  .paper-asset-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .paper-asset-value.pos { color: var(--green); }
  .paper-asset-value.neg { color: var(--red); }

  /* ---- fees line ---- */
  .paper-fees-line {
    font-size: 11px;
    color: var(--text-3);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .paper-fees-line .k { color: var(--text-2); font-weight: 700; }
  .paper-fees-line .note { font-style: italic; }

  /* ---- BloFin-column positions table ---- */
  .paper-positions-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 6px;
  }
  .paper-positions-scroll {
    overflow-x: auto;
    margin-bottom: 6px;
    border: 1px solid var(--card-border);
    border-radius: var(--r-md);
  }
  .paper-positions-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .paper-positions-table th {
    text-align: left;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-3);
    padding: 8px 10px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
  }

  function statsFor(list) {
    var count = list.length, net = 0, wins = 0;
    for (var i = 0; i < count; i++) {
      var p = list[i].pnl || 0;
      net += p;
      if (p > 0) wins++;
    }
    return { count: count, net: net, wins: wins, losses: count - wins, winRate: count ? (wins / count * 100) : null };
  }

  function gatherMarketItems(closedWin) {
    var allDefs = MARKETS.concat(PAPER_MARKET_DEFS);
    var known = {};
    allDefs.forEach(function (m) { known[m.symbol] = true; });
    var extra = {};
    state.trades.concat(state.openTrades).forEach(function (t) {
      if (t.symbol && !known[t.symbol]) extra[t.symbol] = true;
    });
    var list = allDefs.slice();
    Object.keys(extra).sort().forEach(function (sym) {
      list.push({ symbol: sym, name: prettifySymbol(sym), glyph: '◆' });
    });
    return list.map(function (m) {
      var closed = closedWin.filter(function (t) { return t.symbol === m.symbol; });
      var open = state.openTrades.filter(function (t) { return t.symbol === m.symbol; });
      return { type: 'market', id: m.symbol, title: m.name, sub: m.symbol, glyph: m.glyph, closed: closed, open: open, stats: statsFor(closed), paper: !!m.paper };
    });
  }

  function gatherBookItems(closedWin) {
    var order = BOOKS.map(function (b) { return b.name; });
    var extra = {};
    state.trades.concat(state.openTrades).forEach(function (t) {
      if (t.book && order.indexOf(t.book) === -1) extra[t.book] = true;
    });
    var names = order.concat(Object.keys(extra).sort());
    return names.map(function (name) {
      var closed = closedWin.filter(function (t) { return t.book === name; });
      var open = state.openTrades.filter(function (t) { return t.book === name; });
      var meta = bookMetaByName(name);
      var symbols = uniq(closed.concat(open).map(function (t) { return t.symbol; }));
      var sub = (meta && meta.symbol) ? meta.symbol : (symbols.length ? symbols.join(' / ') : 'not yet traded');
      var isPaper = PAPER_BOOK_NAMES.indexOf(name) !== -1;
      return { type: 'book', id: name, title: name, sub: sub, glyph: BOOK_GLYPHS[name] || '\u{1F4D8}', closed: closed, open: open, stats: statsFor(closed), paper: isPaper };
    });
  }

  // ---------------- rendering ----------------

  function render() {
    renderHeaderStats();
    renderGrid();
    renderDrawer();
  }

  function renderHeaderStats() {
    var raw = state.raw;
    if (!raw) return;
    // TOTAL EQUITY = BloFin ledger + every unique paper ledger (owner,
    // 2026-07-24: "treat the entire paper trading... like LIVE. Just put
    // them inside of the updated statistics.") — the composition line
    // underneath keeps it honest about which dollars sit at a real venue
    // vs an internal ledger (see paperTotalEquity's dedup-by-ledger note).
    var blofinEq = raw.equity || 0;
    var paperEq = paperTotalEquity();
    var totalEq = blofinEq + paperEq;
    els.equity.textContent = fmtMoneyPlain(totalEq);
    var goal = raw.goal || 0;
    var pct = goal > 0 ? Math.max(0, Math.min(100, (totalEq / goal) * 100)) : 0;
    els.goalBarFill.style.width = pct.toFixed(1) + '%';
    els.goalText.textContent = fmtMoneyPlain(totalEq) + ' of ' + fmtMoneyPlain(goal) + ' goal, ' + pct.toFixed(0) + '%';
    els.equityComposition.innerHTML = 'BloFin <span class="k">' + fmtMoneyPlain(blofinEq) +
      '</span> · paper <span class="k">' + fmtMoneyPlain(paperEq) + '</span>';

    els.windowPnlLabel.textContent = 'Net PnL · ' + windowDef().label;

    var cw = closedInWindow();
    var s = statsFor(cw);
    els.windowPnl.textContent = s.count ? fmtMoney(s.net) : '—';
    els.windowPnl.className = 'stat-value tabular ' + (s.count ? pnlClass(s.net) : 'neutral');
    els.windowPnlSub.textContent = s.count
      ? (s.count + ' trade' + (s.count === 1 ? '' : 's') + ' · ' + fmtPct(s.winRate) + ' win rate')
      : 'No closed trades in this window';

    drawSparkline(cw);
  }

  function drawSparkline(trades) {
    var canvas = els.sparkline;
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || 130, h = canvas.clientHeight || 52;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var pad = 4;

    if (!trades.length) {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(pad, h / 2);
      ctx.lineTo(w - pad, h / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      return;
    }

    var sorted = trades.slice().sort(function (a, b) { return new Date(a.exitTime) - new Date(b.exitTime); });
    var cum = 0;
    var points = [0];
    sorted.forEach(function (t) { cum += (t.pnl || 0); points.push(cum); });

    var min = Math.min.apply(null, points);
    var max = Math.max.apply(null, points);
    if (min === max) { min -= 1; max += 1; }
    var range = max - min;
    var n = points.length;
    var stepX = n > 1 ? (w - pad * 2) / (n - 1) : 0;

    function xy(i) {
      var x = pad + i * stepX;
      var y = h - pad - ((points[i] - min) / range) * (h - pad * 2);
      return [x, y];
    }

    var last = points[points.length - 1];
    var lineColor = last > 0 ? '#34d399' : (last < 0 ? '#f87171' : 'rgba(255,255,255,0.4)');

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, last >= 0 ? 'rgba(52,211,153,0.28)' : 'rgba(248,113,113,0.28)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var p = xy(i);
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.lineTo(pad + (n - 1) * stepX, h - pad);
    ctx.lineTo(pad, h - pad);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var pp = xy(j);
      if (j === 0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.75;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function renderGrid() {
    var cw = closedInWindow();
    var items = state.view === 'markets' ? gatherMarketItems(cw) : gatherBookItems(cw);
    els.grid.innerHTML = '';
    items.forEach(function (item) {
      els.grid.appendChild(buildCard(item));
    });
  }

  function buildCard(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', item.title + ' trades');
    var s = item.stats;
    var hasOpen = item.open.length > 0;
    var cls = s.count ? pnlClass(s.net) : 'neutral';

    var metaHtml = s.count
      ? '<div class="card-meta">' + s.count + ' trade' + (s.count === 1 ? '' : 's') +
        '<span class="dot">·</span>' + fmtPct(s.winRate) + ' win rate</div>'
      : '<div class="card-empty">No trades in this window yet</div>';

    card.innerHTML =
      '<div class="card-top">' +
        '<div class="card-icon">' + item.glyph + '</div>' +
        '<div class="card-heading">' +
          '<div class="card-title">' + escapeHtml(item.title) +
            (item.paper ? ' <span class="tag-paper">paper</span>' : '') + '</div>' +
          '<div class="card-sub">' + escapeHtml(item.sub) + '</div>' +
        '</div>' +
        (hasOpen ? '<span class="chip chip-open">OPEN</span>' : '') +
      '</div>' +
      '<div class="card-pnl ' + cls + ' tabular">' + (s.count ? fmtMoney(s.net) : '—') + '</div>' +
      metaHtml;

    card.addEventListener('click', function () { openDrawer(item.type, item.id); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(item.type, item.id); }
    });
    return card;
  }

  function openDrawer(type, id) {
    state.drawer = { type: type, id: id };
    renderDrawer();
    els.drawer.classList.add('open');
    els.backdrop.classList.add('open');
  }
  function closeDrawer() {
    state.drawer = null;
    els.drawer.classList.remove('open');
    els.backdrop.classList.remove('open');
  }

  function renderDrawer() {
    if (!state.drawer) return;
    var cw = closedInWindow();
    var list = state.drawer.type === 'market' ? gatherMarketItems(cw) : gatherBookItems(cw);
    var item = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === state.drawer.id) { item = list[i]; break; }
    if (!item) { closeDrawer(); return; }

    els.drawerIcon.textContent = item.glyph;
    els.drawerTitle.textContent = item.title;
    els.drawerSub.textContent = item.sub + ' · ' + windowDef().label;

    var rows = '';
    item.open.forEach(function (t) { rows += buildTradeRow(t); });
    var closedSorted = item.closed.slice().sort(function (a, b) { return new Date(b.exitTime) - new Date(a.exitTime); });
    closedSorted.forEach(function (t) { rows += buildTradeRow(t); });

    els.drawerList.innerHTML = rows || '<div class="drawer-empty">No trades in this window yet.</div>';
  }

  function buildTradeRow(t) {
    var isOpen = t.status === 'open';
    var sideCls = t.side === 'SHORT' ? 'short' : 'long';
    var timeLabel = isOpen ? ('opened ' + fmtLocalDateTime(t.entryTime)) : fmtLocalDateTime(t.exitTime);
    var priceLine = fmtPrice(t.entryPrice) + ' <span class="arrow">→</span> ' +
      (isOpen ? '<span class="live-tag">live</span>' : fmtPrice(t.exitPrice));
    var pnlLabel = isOpen
      ? '<span class="chip chip-open">OPEN</span>'
      : ('<span class="trow-pnl tabular ' + pnlClass(t.pnl) + '">' + fmtMoney(t.pnl) + '</span>');

    var html = '<div class="trow' + (isOpen ? ' trow-open' : '') + '">' +
      '<div class="trow-top">' +
        '<span class="trow-side ' + sideCls + '">' + t.side + '</span>' +
        '<span class="trow-book">' + escapeHtml(t.book) +
          (t.source === 'paper' ? ' <span class="tag-paper">paper</span>' : '') + '</span>' +
        '<span class="trow-time">' + timeLabel + '</span>' +
      '</div>' +
      '<div class="trow-prices">' +
        '<span class="trow-price">' + priceLine + '</span>' +
        pnlLabel +
      '</div>';
    if (t.headline) {
      html += '<div class="trow-headline">“' + escapeHtml(t.headline) + '”</div>';
    }
    html += '</div>';
    return html;
  }

  // ---------------- controls ----------------

  function initControls() {
    WINDOWS.forEach(function (w) {
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = w.label;
      btn.dataset.win = w.id;
      btn.addEventListener('click', function () {
        state.window = w.id;
        updateControlsActive();
        render();
      });
      els.windowTabs.appendChild(btn);
    });
    updateControlsActive();

    els.viewMarkets.addEventListener('click', function () {
      state.view = 'markets'; closeDrawer(); updateControlsActive(); render();
    });
    els.viewBooks.addEventListener('click', function () {
      state.view = 'books'; closeDrawer(); updateControlsActive(); render();
    });
  }

  function updateControlsActive() {
    Array.prototype.forEach.call(els.windowTabs.children, function (btn) {
      btn.classList.toggle('active', btn.dataset.win === state.window);
    });
    els.viewMarkets.classList.toggle('active', state.view === 'markets');
    els.viewBooks.classList.toggle('active', state.view === 'books');
  }

  // ---------------- data fetch ----------------

  function fetchData() {
    fetch(RPC_URL, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      state.raw = data;
      rebuildCombinedTrades();
      state.lastFetch = Date.now();
      state.fetchFailed = false;
      setLiveStatus(true);
      render();
    }).catch(function (e) {
      state.fetchFailed = true;
      setLiveStatus(false);
      if (window.console) console.error('cryptobot pnl fetch failed', e);
    });
  }

  function setLiveStatus(ok) {
    els.liveDot.classList.toggle('down', !ok);
  }

  function tickUpdatedAgo() {
    if (!state.lastFetch) { els.updatedAgo.textContent = 'connecting…'; return; }
    var secs = Math.max(0, Math.round((Date.now() - state.lastFetch) / 1000));
    var label;
    if (secs < 5) label = 'just now';
    else if (secs < 60) label = secs + 's ago';
    else label = Math.floor(secs / 60) + 'm ago';
    els.updatedAgo.textContent = (state.fetchFailed ? 'connection issue · last update ' : 'updated ') + label;
  }

  // ---------------- paper desk (BloFin-clone) ----------------
  // "if you're gonna do a paper desk, build the entire thing... give me
  // the options of seeing the 5-minute, 15-minute, 1-hour, 4-hour, 1-day
  // of each chart. Tell me the open positions... give me the exact
  // trading fees... you will literally have to copy BloFin 1:1." — the
  // internal paper books (tradfi_engine.py's oil/S&P slots + spx_book.py's
  // dedicated S&P dip-buy) rendered as BloFin's own futures screen: a
  // multi-timeframe candlestick chart, a market header row, an Assets
  // panel, a fees line, a BloFin-column positions table, and a trade log.
  // Driven by live_read.py's `paper` block: {books: [...], candles:
  // {symbol: {candles_by_tf, stale_by_tf}}} — candles live ONCE per
  // symbol (not per book) since TradFi-S&P and S&P Dip-Buy both trade
  // SPY; see live_read.py's _build_paper for why.

  var PAPER_TIMEFRAMES = [
    { id: '5m', label: '5m' },
    { id: '15m', label: '15m' },
    { id: '1h', label: '1H' },
    { id: '4h', label: '4H' },
    { id: '1d', label: '1D' }
  ];

  function fetchPaperData() {
    fetch(LIVE_READ_RPC_URL, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      state.paper = (data && data.paper) || { books: [], candles: {} };
      state.paperFetchFailed = false;
      // paper trades now feed the COMBINED headline/grid stats too (not
      // just the Paper desk section below) — rebuild + re-render both.
      rebuildCombinedTrades();
      render();
      renderPaper();
    }).catch(function (e) {
      state.paperFetchFailed = true;
      if (window.console) console.error('cryptobot paper desk fetch failed', e);
    });
  }

  function paperBooksForMarket(market) {
    return (state.paper.books || []).filter(function (b) { return b.market === market; });
  }

  // live_read.py publishes candles as bare [t,o,h,l,c] arrays (compact,
  // see that file's _fmt_candles_compact) — normalized to {t,o,h,l,c}
  // objects here so the existing chart-drawing code stays unchanged.
  function normCandles(arr) {
    return (arr || []).map(function (c) {
      return { t: c[0], o: c[1], h: c[2], l: c[3], c: c[4] };
    });
  }

  function paperCandlesForSymbol(symbol, tf) {
    var entry = (state.paper.candles || {})[symbol];
    if (!entry) return { arr: [], stale: false };
    var raw = (entry.candles_by_tf || {})[tf] || [];
    return { arr: normCandles(raw), stale: !!(entry.stale_by_tf || {})[tf] };
  }

  function fmtHeld(openedAtStr) {
    if (!openedAtStr) return '—';
    var opened = Date.parse(openedAtStr.replace(' UTC', 'Z').replace(' ', 'T'));
    if (isNaN(opened)) opened = Date.parse(openedAtStr);
    if (isNaN(opened)) return '—';
    var mins = Math.max(0, Math.round((Date.now() - opened) / 60000));
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h ' + m + 'm';
  }

  function fmtOpenedAt(openedAtStr) {
    if (!openedAtStr) return '—';
    var d = new Date(openedAtStr.replace(' UTC', 'Z').replace(' ', 'T'));
    if (isNaN(d.getTime())) d = new Date(openedAtStr);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function positionMark(book) {
    if (book.last_price && book.last_price.price != null) return book.last_price.price;
    var c = paperCandlesForSymbol(book.symbol, '1h').arr;
    return c.length ? c[c.length - 1].c : null;
  }

  // BloFin-column math that needs a LIVE mark price (margin/liq/break-even
  // are static, published by live_read.py straight on book.open — see
  // that file's _liq_price/_break_even_price). This only computes what
  // actually depends on the ticking price: unrealized $/%, and margin
  // ratio (equity / maintenance margin, BloFin's own definition).
  function positionPnl(book) {
    var t = book.open;
    if (!t || t.entry == null) return null;
    var mark = positionMark(book);
    if (mark == null) return null;
    var qty = t.contracts_or_notional || 0;
    var dollars = t.side === 'SHORT' ? (t.entry - mark) * qty : (mark - t.entry) * qty;
    var margin = t.margin != null ? t.margin
      : ((t.notional && t.leverage) ? (t.notional / t.leverage)
        : (t.notional || (t.entry * qty)) || null);
    var pct = margin ? (dollars / margin) * 100 : null;
    var mmr = t.mmr_assumed != null ? t.mmr_assumed : 0.005;
    var maintMargin = (mark != null && qty) ? mark * qty * mmr : null;
    var equity = margin != null ? margin + dollars : null;
    var marginRatioPct = (maintMargin && equity != null) ? (equity / maintMargin) * 100 : null;
    return { mark: mark, dollars: dollars, pct: pct, margin: margin, marginRatioPct: marginRatioPct };
  }

  // ---- SVG candlestick chart, BloFin-style position overlay ----

  function buildCandleChartSvg(candles, opens) {
    var W = 900, H = 300, padL = 8, padR = 66, padT = 14, padB = 22;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var n = candles.length;
    if (!n) return '';

    var lo = Infinity, hi = -Infinity;
    candles.forEach(function (c) {
      if (c.l < lo) lo = c.l;
      if (c.h > hi) hi = c.h;
    });
    (opens || []).forEach(function (t) {
      [t.entry, t.stop, t.target].forEach(function (v) {
        if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; }
      });
    });
    if (!isFinite(lo) || !isFinite(hi)) return '';
    if (lo === hi) { lo -= 1; hi += 1; }
    var span = (hi - lo) * 1.08;
    var mid = (hi + lo) / 2;
    lo = mid - span / 2; hi = mid + span / 2;

    function y(v) { return padT + innerH - ((v - lo) / (hi - lo)) * innerH; }
    var slot = innerW / n;
    var bodyW = Math.max(1.5, Math.min(9, slot * 0.62));

    var svg = '<svg class="paper-chart-svg" viewBox="0 0 ' + W + ' ' + H +
      '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">';

    // gridlines (4 horizontal)
    for (var g = 0; g <= 3; g++) {
      var gy = padT + (innerH / 3) * g;
      svg += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + gy.toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
    }

    // candles
    for (var i = 0; i < n; i++) {
      var c = candles[i];
      var cx = padL + slot * i + slot / 2;
      var up = c.c >= c.o;
      var color = up ? '#34d399' : '#f87171';
      var yO = y(c.o), yC = y(c.c), yH = y(c.h), yL = y(c.l);
      svg += '<line x1="' + cx.toFixed(1) + '" y1="' + yH.toFixed(1) + '" x2="' + cx.toFixed(1) +
        '" y2="' + yL.toFixed(1) + '" stroke="' + color + '" stroke-width="1"/>';
      var top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
      svg += '<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + top.toFixed(1) +
        '" width="' + bodyW.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + color + '"/>';
    }

    // position overlay: shaded risk/reward bands + entry/stop/target lines
    (opens || []).forEach(function (t) {
      if (t.entry == null) return;
      var yE = y(t.entry);
      if (t.stop != null) {
        var yS = y(t.stop);
        svg += '<rect x="' + padL + '" y="' + Math.min(yE, yS).toFixed(1) + '" width="' + innerW +
          '" height="' + Math.max(1, Math.abs(yS - yE)).toFixed(1) +
          '" fill="rgba(248,113,113,0.10)"/>';
      }
      if (t.target != null) {
        var yT = y(t.target);
        svg += '<rect x="' + padL + '" y="' + Math.min(yE, yT).toFixed(1) + '" width="' + innerW +
          '" height="' + Math.max(1, Math.abs(yT - yE)).toFixed(1) +
          '" fill="rgba(52,211,153,0.10)"/>';
      }
      function hline(v, color, label) {
        var yy = y(v);
        svg += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) +
          '" y2="' + yy.toFixed(1) + '" stroke="' + color +
          '" stroke-width="1.25" stroke-dasharray="4,3"/>';
        svg += '<rect x="' + (W - padR + 4) + '" y="' + (yy - 8).toFixed(1) +
          '" width="' + (padR - 6) + '" height="16" rx="3" fill="' + color + '"/>';
        svg += '<text x="' + (W - padR + 4 + (padR - 6) / 2) + '" y="' + (yy + 3.5).toFixed(1) +
          '" font-size="10" font-weight="700" text-anchor="middle" fill="#0a0b0f" font-family="inherit">' +
          escapeHtml(label) + '</text>';
      }
      hline(t.entry, 'rgba(238,240,245,0.85)', fmtPrice(t.entry));
      if (t.stop != null) hline(t.stop, '#f87171', fmtPrice(t.stop));
      if (t.target != null) hline(t.target, '#34d399', fmtPrice(t.target));
    });

    svg += '</svg>';
    return svg;
  }

  // ---- timeframe strip (Time · 5m · 15m · 1H · 4H · 1D) ----

  function buildTfStripHtml(symbol) {
    var html = '<div class="paper-tf-strip"><span class="paper-tf-label">Time</span>';
    PAPER_TIMEFRAMES.forEach(function (tf) {
      var stale = paperCandlesForSymbol(symbol, tf.id).stale;
      var active = state.paperTf === tf.id;
      html += '<button type="button" class="paper-tf-btn' + (active ? ' active' : '') +
        (stale ? ' stale' : '') + '" data-tf="' + tf.id + '" title="' +
        (stale ? 'stale — showing the last successfully published bars' : '') +
        '">' + tf.label + '</button>';
    });
    html += '</div>';
    return html;
  }

  // ---- market header row: last price · 24h change · 24h high/low · as-of ----

  function buildMarketHeaderHtml(book) {
    var last = book.last_price ? book.last_price.price : null;
    var asOf = book.last_price ? book.last_price.as_of : null;
    var stale = book.last_price ? !!book.last_price.stale : false;
    var chg = book.change_24h_pct;
    var chgCls = chg == null ? 'neutral' : (chg > 0 ? 'pos' : (chg < 0 ? 'neg' : 'neutral'));
    var chgTxt = chg == null ? '—' : ((chg >= 0 ? '+' : '') + chg.toFixed(2) + '%');
    return '<div class="paper-market-header">' +
      '<div class="paper-mh-last tabular" data-field="mh-last">' + fmtPrice(last) + '</div>' +
      '<div class="paper-mh-change tabular ' + chgCls + '" data-field="mh-change">' + chgTxt +
        ' <span style="font-weight:400;color:var(--text-3)">24h</span></div>' +
      '<div class="paper-mh-stat">24h high <span class="v tabular">' + fmtPrice(book.high_24h) + '</span></div>' +
      '<div class="paper-mh-stat">24h low <span class="v tabular">' + fmtPrice(book.low_24h) + '</span></div>' +
      '<div class="paper-mh-asof' + (stale ? ' stale' : '') + '">' +
        (asOf ? 'as of ' + escapeHtml(asOf) : '') + (stale ? ' (stale)' : '') + '</div>' +
    '</div>';
  }

  // ---- assets row: Equity · Floating PnL · In use ----

  function buildAssetsRowHtml(book) {
    var pnl = book.open ? positionPnl(book) : null;
    var floating = pnl ? pnl.dollars : null;
    var inUse = pnl && pnl.margin != null ? pnl.margin : null;
    var floatCls = pnlClass(floating);
    return '<div class="paper-assets-row">' +
      '<div class="paper-asset-chip"><div class="paper-asset-label">Equity</div>' +
        '<div class="paper-asset-value tabular">' + fmtMoneyPlain(book.ledger_equity) + '</div></div>' +
      '<div class="paper-asset-chip"><div class="paper-asset-label">Floating PnL</div>' +
        '<div class="paper-asset-value tabular ' + floatCls + '" data-field="floating">' +
        (floating == null ? '—' : fmtMoney(floating)) + '</div></div>' +
      '<div class="paper-asset-chip"><div class="paper-asset-label">In use</div>' +
        '<div class="paper-asset-value tabular" data-field="inuse">' +
        (inUse == null ? '$0.00' : fmtMoneyPlain(inUse)) + '</div></div>' +
    '</div>';
  }

  // ---- fees line — maker %, taker %, $ charged at open (see live_read.py
  // _fee_block for why maker==taker: these paper books charge one flat
  // rate, no exchange tier) ----

  function buildFeesLineHtml(book) {
    var f = book.fees || {};
    var entryFeeTxt = (book.open && book.open.entry_fee != null)
      ? fmtMoneyPlain(book.open.entry_fee) : '—';
    return '<div class="paper-fees-line">' +
      '<span class="k">Fees</span> maker ' + (f.maker_pct != null ? f.maker_pct.toFixed(2) : '—') +
      '% · taker ' + (f.taker_pct != null ? f.taker_pct.toFixed(2) : '—') +
      '% · charged at open ' + entryFeeTxt +
      '<div class="note">' + escapeHtml(f.note || '') + '</div>' +
    '</div>';
  }

  // ---- BloFin-column positions table ----
  // Contracts | Total | Avg. Price | Margin | PnL(PnL%) | Realized PnL |
  // Est. Liq. Price | Break Even Price | Mark Price | Margin Ratio
  // — plus opened-at/held/stop-target-distance underneath, per book.

  function buildPositionsTableHtml(book) {
    var t = book.open;
    if (!t) {
      return '<div class="paper-positions-label">Positions</div>' +
        '<div class="paper-flat">flat — waiting for a setup</div>';
    }
    var sideCls = t.side === 'SHORT' ? 'short' : 'long';
    var pnl = positionPnl(book);
    var dollars = pnl ? pnl.dollars : null;
    var pct = pnl ? pnl.pct : null;
    var mark = pnl ? pnl.mark : null;
    var marginRatio = pnl ? pnl.marginRatioPct : null;
    var cls = pnlClass(dollars);
    var qty = t.contracts_or_notional;
    // "Realized PnL" for a still-open position = the fees already booked
    // against it (entry fee, charged when the position opened) — see
    // live_read.py's _tradfi_open_dict/_spx_open_dict (entry_fee).
    var realizedPnl = t.entry_fee != null ? -t.entry_fee : null;
    var stopDistPct = (t.stop != null && mark) ? ((t.stop - mark) / mark * 100) : null;
    var targetDistPct = (t.target != null && mark) ? ((t.target - mark) / mark * 100) : null;
    var mmrPct = t.mmr_assumed != null ? (t.mmr_assumed * 100).toFixed(1) : '0.5';

    return '' +
      '<div class="paper-positions-label">Positions</div>' +
      '<div class="paper-positions-scroll"><table class="paper-positions-table">' +
        '<thead><tr>' +
          '<th>Contracts</th><th>Total</th><th>Avg. Price</th><th>Margin</th>' +
          '<th>PnL (PnL%)</th><th>Realized PnL</th><th>Est. Liq. Price</th>' +
          '<th>Break Even Price</th><th>Mark Price</th><th>Margin Ratio</th>' +
        '</tr></thead>' +
        '<tbody><tr>' +
          '<td><span class="paper-pos-side ' + sideCls + '">' + t.side + '</span> ' +
            (qty == null ? '—' : qty.toFixed(2)) +
            (t.leverage != null ? '<span class="contracts-lev">' + t.leverage.toFixed(1) + 'x</span>' : '') +
          '</td>' +
          '<td>' + (t.notional == null ? '—' : fmtMoneyPlain(t.notional)) + '</td>' +
          '<td>' + fmtPrice(t.entry) + '</td>' +
          '<td>' + (t.margin == null ? '—' : fmtMoneyPlain(t.margin)) +
            ' <span style="color:var(--text-3);font-size:9.5px">isolated</span></td>' +
          '<td class="paper-pos-cell-pnl ' + cls + '" data-field="pnl">' +
            (dollars == null ? '—' : fmtMoney(dollars)) +
            '<span class="paper-pos-pnlpct" data-field="pnlpct">' +
              (pct == null ? '' : ' (' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%)') +
            '</span></td>' +
          '<td class="paper-pos-cell-pnl ' + pnlClass(realizedPnl) + '">' +
            (realizedPnl == null ? '—' : fmtMoney(realizedPnl)) + '</td>' +
          '<td>' + fmtPrice(t.liq_price) + '</td>' +
          '<td>' + fmtPrice(t.break_even) + '</td>' +
          '<td data-field="mark">' + fmtPrice(mark) + '</td>' +
          '<td data-field="marginratio">' + (marginRatio == null ? '—' : marginRatio.toFixed(0) + '%') + '</td>' +
        '</tr></tbody>' +
      '</table></div>' +
      '<div class="paper-mmr-note">est. liq price / margin ratio assume a ' + mmrPct +
        '% maintenance margin rate — OUR assumption, not a published BloFin figure ' +
        '(no BloFin instrument exists for this market)</div>' +
      '<div class="paper-pos-meta">' +
        '<span>opened <span class="v">' + escapeHtml(fmtOpenedAt(t.opened_at)) + '</span></span>' +
        '<span>held <span class="v" data-field="held">' + fmtHeld(t.opened_at) + '</span></span>' +
        '<span>stop <span class="v stop">' + (t.stop == null ? '— (signal exit)' :
          fmtPrice(t.stop) + (stopDistPct == null ? '' : ' (' + (stopDistPct >= 0 ? '+' : '') + stopDistPct.toFixed(2) + '%)')) +
          '</span></span>' +
        '<span>target <span class="v target">' + (t.target == null ? '— (signal exit)' :
          fmtPrice(t.target) + (targetDistPct == null ? '' : ' (' + (targetDistPct >= 0 ? '+' : '') + targetDistPct.toFixed(2) + '%)')) +
          '</span></span>' +
      '</div>';
  }

  // ---- live tick — PnL/mark/margin-ratio/held/floating-PnL, once a second

  function tickPaperLive() {
    var active = paperBooksForMarket(state.paperMarket);
    active.forEach(function (book, i) {
      var el = document.querySelector('.paper-book-card[data-paper-pos="' + i + '"]');
      if (!el) return;
      var heldEl = el.querySelector('[data-field="held"]');
      if (heldEl && book.open) heldEl.textContent = fmtHeld(book.open.opened_at);
      if (!book.open) return;
      var pnl = positionPnl(book);
      if (!pnl) return;
      var markEl = el.querySelector('[data-field="mark"]');
      if (markEl) markEl.textContent = fmtPrice(pnl.mark);
      var cls = pnlClass(pnl.dollars);
      var pnlEl = el.querySelector('[data-field="pnl"]');
      if (pnlEl) {
        pnlEl.className = 'paper-pos-cell-pnl ' + cls;
        pnlEl.innerHTML = (pnl.dollars == null ? '—' : fmtMoney(pnl.dollars)) +
          '<span class="paper-pos-pnlpct" data-field="pnlpct">' +
            (pnl.pct == null ? '' : ' (' + (pnl.pct >= 0 ? '+' : '') + pnl.pct.toFixed(2) + '%)') +
          '</span>';
      }
      var mrEl = el.querySelector('[data-field="marginratio"]');
      if (mrEl) mrEl.textContent = pnl.marginRatioPct == null ? '—' : pnl.marginRatioPct.toFixed(0) + '%';
      var floatEl = el.querySelector('[data-field="floating"]');
      if (floatEl) {
        floatEl.textContent = pnl.dollars == null ? '—' : fmtMoney(pnl.dollars);
        floatEl.className = 'paper-asset-value tabular ' + cls;
      }
    });
  }

  // ---- trade log ----

  function buildTradeLogHtml(book) {
    var rows = book.trades || [];
    if (!rows.length) {
      return '<div class="paper-log-label">Trade log</div><div class="paper-log-empty">no closed trades yet</div>';
    }
    var html = '<div class="paper-log-label">Trade log · last ' + rows.length +
      ' <span style="text-transform:none;font-weight:400;letter-spacing:normal;color:var(--text-3)">' +
      '(each PnL already nets both legs\' fees)</span></div><div class="paper-log">';
    rows.forEach(function (t) {
      var sideCls = t.side === 'SHORT' ? 'short' : 'long';
      var priceBit = (t.entry != null && t.exit != null)
        ? (fmtPrice(t.entry) + ' → ' + fmtPrice(t.exit))
        : '—';
      html += '<div class="paper-log-row">' +
        '<span class="paper-log-time">' + escapeHtml(t.closed_date || '—') + '</span>' +
        '<span class="paper-log-side ' + sideCls + '">' + escapeHtml(t.side || '—') + '</span>' +
        '<span class="paper-log-prices">' + priceBit + '</span>' +
        '<span class="paper-log-reason">' + escapeHtml((t.reason || '').replace(/_/g, ' ') || '') + '</span>' +
        '<span class="paper-log-pnl tabular ' + pnlClass(t.pnl) + '">' + (t.pnl == null ? '—' : fmtMoney(t.pnl)) + '</span>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---- assembly ----

  function renderPaper() {
    var books = state.paper.books || [];
    els.paperSection.hidden = books.length === 0;
    if (!books.length) return;

    buildPaperTabsUi();
    var marketBooks = paperBooksForMarket(state.paperMarket);
    if (!marketBooks.length) marketBooks = books;

    var chartSymbol = marketBooks.length ? marketBooks[0].symbol : null;
    var chartData = chartSymbol ? paperCandlesForSymbol(chartSymbol, state.paperTf) : { arr: [] };
    var opens = marketBooks.filter(function (b) { return b.open; }).map(function (b) { return b.open; });
    var headerBook = marketBooks.filter(function (b) { return b.last_price; })[0] || marketBooks[0];

    var chartHtml;
    if (chartData.arr && chartData.arr.length) {
      chartHtml = buildCandleChartSvg(chartData.arr, opens);
    } else {
      chartHtml = '<div class="paper-chart-empty">chart data warming up — check back next publish cycle</div>';
    }

    var html = '<div class="paper-chart-card">' +
      '<div class="paper-chart-head">' +
        '<div class="paper-chart-name">' + escapeHtml(state.paperMarket) + '</div>' +
        (chartSymbol ? buildTfStripHtml(chartSymbol) : '') +
      '</div>' +
      (headerBook ? buildMarketHeaderHtml(headerBook) : '') +
      chartHtml +
    '</div>';

    html += '<div class="paper-books-row">';
    marketBooks.forEach(function (book, i) {
      html += '<div class="paper-book-card" data-paper-pos="' + i + '">' +
        '<div class="paper-book-head">' +
          '<div class="paper-book-name">' + escapeHtml(book.name) + '<span class="tag">paper</span></div>' +
          '<div class="paper-book-record">' + (book.record ? (book.record.w + 'W / ' + book.record.l + 'L') : '—') +
            ' · today ' + fmtMoney(book.today_pnl) + '</div>' +
        '</div>' +
        buildAssetsRowHtml(book) +
        buildFeesLineHtml(book) +
        buildPositionsTableHtml(book) +
        buildTradeLogHtml(book) +
      '</div>';
    });
    html += '</div>';

    els.paperContent.innerHTML = html;
    wireTfStripClicks();
  }

  function wireTfStripClicks() {
    var btns = els.paperContent.querySelectorAll('.paper-tf-btn');
    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.paperTf = btn.getAttribute('data-tf');
        renderPaper();
      });
    });
  }

  function buildPaperTabsUi() {
    var present = {};
    (state.paper.books || []).forEach(function (b) { present[b.market] = true; });
    var markets = PAPER_MARKETS.filter(function (m) { return present[m]; });
    if (markets.indexOf(state.paperMarket) === -1 && markets.length) {
      state.paperMarket = markets[0];
    }
    els.paperTabs.innerHTML = '';
    markets.forEach(function (m) {
      var btn = document.createElement('button');
      btn.className = 'paper-tab' + (m === state.paperMarket ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', function () {
        state.paperMarket = m;
        renderPaper();
      });
      els.paperTabs.appendChild(btn);
    });
  }

  // ---------------- init ----------------

  function cacheEls() {
    els.equity = $('#equity-value');
    els.goalBarFill = $('#goal-bar-fill');
    els.goalText = $('#goal-text');
    els.equityComposition = $('#equity-composition');
    els.windowPnlLabel = $('#window-pnl-label');
    els.windowPnl = $('#window-pnl');
    els.windowPnlSub = $('#window-pnl-sub');
    els.sparkline = $('#sparkline');
    els.updatedAgo = $('#updated-ago');
    els.liveDot = $('#live-dot');
    els.windowTabs = $('#window-tabs');
    els.viewMarkets = $('#view-markets');
    els.viewBooks = $('#view-books');
    els.grid = $('#grid');
    els.drawer = $('#drawer');
    els.backdrop = $('#backdrop');
    els.drawerIcon = $('#drawer-icon');
    els.drawerTitle = $('#drawer-title');
    els.drawerSub = $('#drawer-sub');
    els.drawerList = $('#drawer-list');
    els.drawerClose = $('#drawer-close');
    els.paperSection = $('#paper-section');
    els.paperTabs = $('#paper-tabs');
    els.paperContent = $('#paper-content');
  }

  function init() {
    cacheEls();
    initControls();
    els.drawerClose.addEventListener('click', closeDrawer);
    els.backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    window.addEventListener('resize', function () {
      if (state.raw) drawSparkline(closedInWindow());
    });

    fetchData();
    setInterval(fetchData, POLL_MS);
    setInterval(tickUpdatedAgo, 1000);
    tickUpdatedAgo();

    fetchPaperData();
    setInterval(fetchPaperData, POLL_MS);
    setInterval(tickPaperLive, 1000);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
