<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cryptobot · PnL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f14'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%2334d399' font-family='Arial'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-0: #090b10;
    --bg-1: #0d0f16;
    --bg-2: #11141c;
    --card-bg: rgba(255,255,255,0.035);
    --card-bg-hover: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.085);
    --text-1: #eef0f5;
    --text-2: #98a0b3;
    --text-3: #5c6377;
    --accent: #4d8dff;
    --accent-soft: rgba(77,141,255,0.16);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.14);
    --red: #f87171;
    --red-soft: rgba(248,113,113,0.14);
    --gold: #f4c15c;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(77,141,255,0.10), transparent 60%),
      radial-gradient(700px 460px at 100% 0%, rgba(52,211,153,0.07), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    background-attachment: fixed;
  }

  .tabular { font-variant-numeric: tabular-nums; }

  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 28px 64px;
  }

  /* ---------- header ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .brand-mark .sep { color: var(--text-3); margin: 0 2px; font-weight: 500; }
  .brand-mark .accent { color: var(--accent); }

  .live-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(52,211,153,0.5);
    animation: pulse 2s infinite;
    flex: none;
  }
  .live-dot.down { background: var(--red); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.neutral { color: var(--text-1); }

  .goal-bar-track {
    margin-top: 14px;
    height: 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
  }
  .goal-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--accent), #7db4ff);
    transition: width 0.6s ease;
  }
  .goal-text {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-2);
  }

  .pnl-card-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .pnl-card-left { min-width: 0; flex: 1; }
  .pnl-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-2);
  }
  #sparkline {
    width: 130px;
    height: 52px;
    flex: none;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:hover { color: var(--text-1); }
  .tab.active { background: var(--accent-soft); color: #bcd4ff; }

  .view-toggle {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
  }
  .view-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .view-btn:hover { color: var(--text-1); }
  .view-btn.active { background: rgba(255,255,255,0.09); color: var(--text-1); }

  /* ---------- grid / cards ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 18px 18px 16px;
    cursor: pointer;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    outline: none;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    background: var(--card-bg-hover);
    border-color: rgba(255,255,255,0.16);
    box-shadow: 0 14px 34px rgba(0,0,0,0.38);
  }
  .card:active { transform: translateY(-1px); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex: none;
  }
  .card-heading { min-width: 0; flex: 1; }
  .card-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 6px;
    flex: none;
  }
  .chip-open {
    background: var(--accent-soft);
    color: #bcd4ff;
    animation: chip-pulse 2.4s infinite;
  }
  @keyframes chip-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .card-pnl {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .card-pnl.pos { color: var(--green); }
  .card-pnl.neg { color: var(--red); }
  .card-pnl.neutral { color: var(--text-2); }

  .card-meta {
    font-size: 12px;
    color: var(--text-2);
  }
  .card-meta .dot { margin: 0 6px; color: var(--text-3); }

  .card-empty {
    font-size: 12.5px;
    color: var(--text-3);
    font-style: italic;
  }

  /* ---------- drawer ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4,5,8,0.55);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 40;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(420px, 100vw);
    background: #0c0e14;
    border-left: 1px solid var(--card-border);
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    transform: translateX(100%);
    transition: transform 0.26s cubic-bezier(.2,.8,.25,1);
    z-index: 41;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--card-border);
    flex: none;
  }
  .drawer-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex: none;
  }
  .drawer-titlewrap { min-width: 0; flex: 1; }
  .drawer-title { font-size: 16px; font-weight: 700; }
  .drawer-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .drawer-close {
    appearance: none;
    border: none;
    background: rgba(255,255,255,0.05);
    color: var(--text-2);
    width: 30px; height: 30px;
    border-radius: 9px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }
  .drawer-close:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }

  .drawer-list {
    overflow-y: auto;
    padding: 10px 16px 24px;
    flex: 1;
  }

  .trow {
    padding: 13px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.055);
  }
  .trow:last-child { border-bottom: none; }
  .trow-open { background: rgba(77,141,255,0.05); border-radius: var(--r-sm); }

  .trow-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 12px;
  }
  .trow-side {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 5px;
    color: #fff;
    flex: none;
  }
  .trow-side.long { background: #0f7a53; }
  .trow-side.short { background: #a6303a; }
  .trow-book {
    color: var(--text-2);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trow-time {
    margin-left: auto;
    color: var(--text-3);
    flex: none;
    white-space: nowrap;
  }

  .trow-prices {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
  }
  .trow-price { font-variant-numeric: tabular-nums; color: var(--text-1); }
  .trow-price .arrow { color: var(--text-3); margin: 0 6px; }
  .trow-price .live-tag {
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .trow-pnl {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .trow-pnl.pos { color: var(--green); }
  .trow-pnl.neg { color: var(--red); }
  .trow-pnl.neutral { color: var(--text-2); }

  .trow-headline {
    margin-top: 7px;
    font-size: 12px;
    font-style: italic;
    color: var(--text-2);
    line-height: 1.4;
  }

  .drawer-empty {
    padding: 40px 12px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    font-style: italic;
  }

  /* ---------- paper desk ---------- */

  .paper-section { margin-top: 32px; }

  .paper-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .paper-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-1);
  }
  .paper-title-sub {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .paper-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 4px;
  }
  .paper-tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .paper-tab:hover { color: var(--text-1); }
  .paper-tab.active { background: var(--accent-soft); color: #bcd4ff; }

  .paper-market { display: flex; flex-direction: column; gap: 14px; }

  .paper-chart-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 16px 16px 10px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .paper-chart-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .paper-chart-name { font-size: 13.5px; font-weight: 700; color: var(--text-1); }
  .paper-chart-asof { font-size: 11px; color: var(--text-3); }
  .paper-chart-asof.stale { color: var(--gold); }
  .paper-chart-svg { width: 100%; height: auto; display: block; }
  .paper-chart-empty {
    padding: 46px 12px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    font-style: italic;
  }

  .paper-books-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
  }

  .paper-book-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-lg);
    padding: 16px 18px 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .paper-book-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 12px;
  }
  .paper-book-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-1);
  }
  .paper-book-name .tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-3);
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .paper-book-ledger {
    font-size: 12px;
    color: var(--text-2);
    text-align: right;
  }
  .paper-book-ledger .val { color: var(--text-1); font-weight: 700; }
  .paper-book-record {
    font-size: 11px;
    color: var(--text-3);
    text-align: right;
    margin-top: 1px;
  }

  .paper-flat {
    padding: 22px 8px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    font-style: italic;
    border: 1px dashed var(--card-border);
    border-radius: var(--r-md);
    margin-bottom: 14px;
  }

  .paper-pos {
    border: 1px solid var(--card-border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.02);
  }
  .paper-pos-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .paper-pos-side {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
    flex: none;
  }
  .paper-pos-side.long { background: #0f7a53; }
  .paper-pos-side.short { background: #a6303a; }
  .paper-pos-held {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .paper-pos-pnl {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .paper-pos-pnl.pos { color: var(--green); }
  .paper-pos-pnl.neg { color: var(--red); }
  .paper-pos-pnl.neutral { color: var(--text-2); }
  .paper-pos-pnlpct {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .paper-pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 8px 14px;
    font-size: 12px;
  }
  .paper-pos-grid .lbl {
    color: var(--text-3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .paper-pos-grid .v { color: var(--text-1); font-variant-numeric: tabular-nums; }
  .paper-pos-grid .v.stop { color: var(--red); }
  .paper-pos-grid .v.target { color: var(--green); }

  .paper-log-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 6px;
  }
  .paper-log {
    max-height: 260px;
    overflow-y: auto;
  }
  .paper-log-empty {
    font-size: 12px;
    color: var(--text-3);
    font-style: italic;
    padding: 8px 2px;
  }
  .paper-log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.055);
    font-size: 11.5px;
  }
  .paper-log-row:last-child { border-bottom: none; }
  .paper-log-time { color: var(--text-3); flex: none; width: 64px; }
  .paper-log-side {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
    flex: none;
  }
  .paper-log-side.long { background: #0f7a53; }
  .paper-log-side.short { background: #a6303a; }
  .paper-log-prices {
    color: var(--text-2);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .paper-log-reason { color: var(--text-3); flex: none; font-size: 10.5px; }
  .paper-log-pnl {
    font-weight: 700;
    flex: none;
    width: 74px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .paper-log-pnl.pos { color: var(--green); }
  .paper-log-pnl.neg { color: var(--red); }
  .paper-log-pnl.neutral { color: var(--text-2); }

  /* ---------- footer ---------- */

  .footer-note {
    margin-top: 40px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 720px) {
    .app { padding: 18px 16px 48px; }
    .stats-row { grid-template-columns: 1fr; }
    .pnl-card-body { flex-direction: row; }
    #sparkline { width: 96px; }
    .stat-value { font-size: 26px; }
    .controls-row { flex-direction: column; align-items: stretch; }
    .tabs, .view-toggle { justify-content: space-between; }
    .grid { grid-template-columns: 1fr 1fr; }
    .paper-heading { flex-direction: column; align-items: stretch; }
    .paper-books-row { grid-template-columns: 1fr; }
  }

  @media (max-width: 460px) {
    .grid { grid-template-columns: 1fr; }
    .brand-mark { font-size: 16px; }
    .drawer { width: 100vw; }
    .paper-pos-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand">

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  function fmtMoney(n) {

  function fmtMoneyPlain(n) {
    if (n == null || isNaN(n)) return '—';

  function fmtPrice(n) {
    if (n == null || isNaN(n)) return '—';
    var decimals = n >= 100 ? 2 : (n >= 1 ? 4 : 6);
    return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function fmtPct(n) {
    if (n == null || isNaN(n)) return '—';

  }
  function pnlClass(n) {
    if (n == null || isNaN(n) || n === 0) return 'neutral';

  }
  function fmtLocalDateTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  function prettifySymbol(sym) {
    return String(sym).replace(/-USDT$/, '').replace(/-SWAP$/, '');
  }
  function capitalize(s) {
    s = String(s);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (x && !seen[x]) { seen[x] = true; out.push(x); } });
    return out;
  }

  // ---------------- pairing logic ----------------

  function inferSide(entryPrice, exitPrice, pnl, book, trigger) {
    if (entryPrice != null && exitPrice != null && pnl != null && exitPrice !== entryPrice) {
      var sDelta = (exitPrice - entryPrice) > 0 ? 1 : -1;
      var sPnl = pnl > 0 ? 1 : (pnl < 0 ? -1 : 0);
      if (sPnl !== 0) return (sDelta === sPnl) ? 'LONG' : 'SHORT';
    }
    if (book === 'Shorts Lab') return 'SHORT';
    if (trigger && /short/i.test(trigger)) return 'SHORT';
    return 'LONG';
  }

  function buildTrades(events) {
    var chrono = events.slice().reverse();
    var pending = {};
    var closed = [];
    var stillOpen = [];

    for (var i = 0; i < chrono.length; i++) {
      var ev = chrono[i];
      var action = ev.action || '';
      if (action.indexOf('would_') === 0) continue;
      var key = ev.book + '|' + ev.symbol;
      if (action.indexOf('enter') !== -1) {
        if (!pending[key]) pending[key] = [];
        pending[key].push(ev);
      } else if (action.indexOf('exit') !== -1 && action.indexOf('failed') === -1) {
        var q = pending[key];
        var entry = (q && q.length) ? q.shift() : null;
        closed.push({
          book: ev.book,
          symbol: ev.symbol,
          entryTime: entry ? entry.at : null,
          entryPrice: entry ? entry.price : null,
          contracts: entry ? entry.contracts : ev.contracts,
          trigger: entry ? entry.trigger : ev.trigger,
          headline: entry ? entry.headline : ev.headline,
          exitTime: ev.at,
          exitPrice: ev.price,
          pnl: ev.pnl,
          status: 'closed',
          side: inferSide(entry ? entry.price : null, ev.price, ev.pnl, ev.book, entry ? entry.trigger : ev.trigger)
        });
      }
    }

    Object.keys(pending).forEach(function (key) {
      pending[key].forEach(function (entry) {
        stillOpen.push({
          book: entry.book,
          symbol: entry.symbol,
          entryTime: entry.at,
          entryPrice: entry.price,
          contracts: entry.contracts,
          trigger: entry.trigger,
          headline: entry.headline,
          exitTime: null,
          exitPrice: null,
          pnl: null,
          status: 'open',
          side: inferSide(null, null, null, entry.book, entry.trigger)
        });
      });
    });

    return { closed: closed, open: stillOpen };
  }

  function bookMetaByKey(key) {
    for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].key === key) return BOOKS[i];
    return null;
  }
  function bookMetaByName(name) {
    for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].name === name) return BOOKS[i];
    return null;
  }

  function crossCheckOpen(openObj, pairedOpen) {
    var result = pairedOpen.slice();
    if (!openObj) return result;
    Object.keys(openObj).forEach(function (key) {
      var raw = openObj[key];
      if (!raw) return;
      var meta = bookMetaByKey(key) || { key: key, name: capitalize(key), symbol: null };
      var already = result.some(function (t) { return t.book === meta.name; });
      if (already) return;
      var symbol = raw.symbol || meta.symbol || 'BTC-USDT';
      var direction = (raw.direction != null) ? raw.direction : (key === 'lab' ? -1 : 1);
      result.push({
        book: meta.name,
        symbol: symbol,
        entryTime: raw.entry_time || raw.entry_date || null,
        entryPrice: (raw.entry_price != null) ? raw.entry_price : null,
        contracts: (raw.contracts != null) ? raw.contracts : null,
        trigger: raw.trigger || raw.reason || null,
        headline: raw.headline || null,
        exitTime: null, exitPrice: null, pnl: null,
        status: 'open',
        side: direction < 0 ? 'SHORT' : 'LONG'
      });
    });
    return result;
  }

  // ---------------- window / stats ----------------

  function windowDef() {
    for (var i = 0; i < WINDOWS.length; i++) if (WINDOWS[i].id === state.window) return WINDOWS[i];
    return WINDOWS[2];
  }

  function closedInWindow() {
    var wd = windowDef();
    var cutoff = Date.now() - wd.days * 86400000;
    return state.trades.filter(function (t) {
      var ts = new Date(t.exitTime).getTime();
      return !isNaN(ts) && ts >= cutoff;
    });
  }

  function statsFor(list) {
    var count = list.length, net = 0, wins = 0;
    for (var i = 0; i < count; i++) {
      var p = list[i].pnl || 0;
      net += p;
      if (p > 0) wins++;
    }
    return { count: count, net: net, wins: wins, losses: count - wins, winRate: count ? (wins / count * 100) : null };
  }

  function gatherMarketItems(closedWin) {
    var known = {};
    MARKETS.forEach(function (m) { known[m.symbol] = true; });
    var extra = {};
    state.trades.concat(state.openTrades).forEach(function (t) {
      if (t.symbol && !known[t.symbol]) extra[t.symbol] = true;
    });
    var list = MARKETS.slice();
    Object.keys(extra).sort().forEach(function (sym) {
      list.push({ symbol: sym, name: prettifySymbol(sym), glyph: '◆' });
    });
    return list.map(function (m) {
      var closed = closedWin.filter(function (t) { return t.symbol === m.symbol; });
      var open = state.openTrades.filter(function (t) { return t.symbol === m.symbol; });
      return { type: 'market', id: m.symbol, title: m.name, sub: m.symbol, glyph: m.glyph, closed: closed, open: open, stats: statsFor(closed) };
    });
  }

  function gatherBookItems(closedWin) {
    var order = BOOKS.map(function (b) { return b.name; });
    var extra = {};
    state.trades.concat(state.openTrades).forEach(function (t) {
      if (t.book && order.indexOf(t.book) === -1) extra[t.book] = true;
    });
    var names = order.concat(Object.keys(extra).sort());
    return names.map(function (name) {
      var closed = closedWin.filter(function (t) { return t.book === name; });
      var open = state.openTrades.filter(function (t) { return t.book === name; });
      var meta = bookMetaByName(name);
      var symbols = uniq(closed.concat(open).map(function (t) { return t.symbol; }));
      var sub = (meta && meta.symbol) ? meta.symbol : (symbols.length ? symbols.join(' / ') : 'not yet traded');
      return { type: 'book', id: name, title: name, sub: sub, glyph: BOOK_GLYPHS[name] || '\u{1F4D8}', closed: closed, open: open, stats: statsFor(closed) };
    });
  }

  // ---------------- rendering ----------------

  function render() {
    renderHeaderStats();
    renderGrid();
    renderDrawer();

  function renderHeaderStats() {
    var raw = state.raw;
    if (!raw) return;
    els.equity.textContent = fmtMoneyPlain(raw.equity);
    var goal = raw.goal || 0;
    var pct = goal > 0 ? Math.max(0, Math.min(100, (raw.equity / goal) * 100)) : 0;
    els.goalBarFill.style.width = pct.toFixed(1) + '%';
    els.goalText.textContent = fmtMoneyPlain(raw.equity) + ' of ' + fmtMoneyPlain(goal) + ' goal, ' + pct.toFixed(0) + '%';

    els.windowPnlLabel.textContent = 'Net PnL · ' + windowDef().label;

    var cw = closedInWindow();
    var s = statsFor(cw);
    els.windowPnl.textContent = s.count ? fmtMoney(s.net) : '—';
    els.windowPnl.className = 'stat-value tabular ' + (s.count ? pnlClass(s.net) : 'neutral');
    els.windowPnlSub.textContent = s.count
      ? (s.count + ' trade' + (s.count === 1 ? '' : 's') + ' · ' + fmtPct(s.winRate) + ' win rate')
      : 'No closed trades in this window';

    drawSparkline(cw);
  }

  function drawSparkline(trades) {
    var canvas = els.sparkline;
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || 130, h = canvas.clientHeight || 52;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var pad = 4;

    if (!trades.length) {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(pad, h / 2);
      ctx.lineTo(w - pad, h / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      return;
    }

    var sorted = trades.slice().sort(function (a, b) { return new Date(a.exitTime) - new Date(b.exitTime); });
    var cum = 0;
    var points = [0];
    sorted.forEach(function (t) { cum += (t.pnl || 0); points.push(cum); });

    var min = Math.min.apply(null, points);
    var max = Math.max.apply(null, points);
    if (min === max) { min -= 1; max += 1; }
    var range = max - min;
    var n = points.length;
    var stepX = n > 1 ? (w - pad * 2) / (n - 1) : 0;

    function xy(i) {
      var x = pad + i * stepX;
      var y = h - pad - ((points[i] - min) / range) * (h - pad * 2);
      return [x, y];
    }

    var last = points[points.length - 1];
    var lineColor = last > 0 ? '#34d399' : (last < 0 ? '#f87171' : 'rgba(255,255,255,0.4)');

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, last >= 0 ? 'rgba(52,211,153,0.28)' : 'rgba(248,113,113,0.28)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var p = xy(i);
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.lineTo(pad + (n - 1) * stepX, h - pad);
    ctx.lineTo(pad, h - pad);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var pp = xy(j);
      if (j === 0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.75;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function renderGrid() {
    var cw = closedInWindow();
    var items = state.view === 'markets' ? gatherMarketItems(cw) : gatherBookItems(cw);
    els.grid.innerHTML = '';
    items.forEach(function (item) {
      els.grid.appendChild(buildCard(item));

  function buildCard(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', item.title + ' trades');
    var s = item.stats;
    var hasOpen = item.open.length > 0;
    var cls = s.count ? pnlClass(s.net) : 'neutral';

    var metaHtml = s.count
      ? '<div class="card-meta">' + s.count + ' trade' + (s.count === 1 ? '' : 's') +
        '<span class="dot">·</span>' + fmtPct(s.winRate) + ' win rate</div>'
      : '<div class="card-empty">No trades in this window yet</div>';

    card.innerHTML =
      '<div class="card-top">' +
        '<div class="card-icon">' + item.glyph + '</div>' +
        '<div class="card-heading">' +
          '<div class="card-title">' + escapeHtml(item.title) + '</div>' +
          '<div class="card-sub">' + escapeHtml(item.sub) + '</div>' +
        '</div>' +
        (hasOpen ? '<span class="chip chip-open">OPEN</span>' : '') +
      '</div>' +
      '<div class="card-pnl ' + cls + ' tabular">' + (s.count ? fmtMoney(s.net) : '—') + '</div>' +
      metaHtml;

    card.addEventListener('click', function () { openDrawer(item.type, item.id); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(item.type, item.id); }
    });
    return card;
  }

  function openDrawer(type, id) {
    state.drawer = { type: type, id: id };
    renderDrawer();
    els.drawer.classList.add('open');
    els.backdrop.classList.add('open');
  }
  function closeDrawer() {
    state.drawer = null;
    els.drawer.classList.remove('open');
    els.backdrop.classList.remove('open');
  }

  function renderDrawer() {
    if (!state.drawer) return;
    var cw = closedInWindow();
    var list = state.drawer.type === 'market' ? gatherMarketItems(cw) : gatherBookItems(cw);
    var item = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === state.drawer.id) { item = list[i]; break; }
    if (!item) { closeDrawer(); return; }

    els.drawerIcon.textContent = item.glyph;
    els.drawerTitle.textContent = item.title;
    els.drawerSub.textContent = item.sub + ' · ' + windowDef().label;

    var rows = '';
    item.open.forEach(function (t) { rows += buildTradeRow(t); });
    var closedSorted = item.closed.slice().sort(function (a, b) { return new Date(b.exitTime) - new Date(a.exitTime); });
    closedSorted.forEach(function (t) { rows += buildTradeRow(t); });

    els.drawerList.innerHTML = rows || '<div class="drawer-empty">No trades in this window yet.</div>';
  }

  function buildTradeRow(t) {
    var isOpen = t.status === 'open';
    var sideCls = t.side === 'SHORT' ? 'short' : 'long';
    var timeLabel = isOpen ? ('opened ' + fmtLocalDateTime(t.entryTime)) : fmtLocalDateTime(t.exitTime);
    var priceLine = fmtPrice(t.entryPrice) + ' <span class="arrow">→</span> ' +
      (isOpen ? '<span class="live-tag">live</span>' : fmtPrice(t.exitPrice));
    var pnlLabel = isOpen
      ? '<span class="chip chip-open">OPEN</span>'
      : ('<span class="trow-pnl tabular ' + pnlClass(t.pnl) + '">' + fmtMoney(t.pnl) + '</span>');

    var html = '<div class="trow' + (isOpen ? ' trow-open' : '') + '">' +
      '<div class="trow-top">' +
        '<span class="trow-side ' + sideCls + '">' + t.side + '</span>' +
        '<span class="trow-book">' + escapeHtml(t.book) + '</span>' +
        '<span class="trow-time">' + timeLabel + '</span>' +
      '</div>' +
      '<div class="trow-prices">' +
        '<span class="trow-price">' + priceLine + '</span>' +
        pnlLabel +
      '</div>';
    if (t.headline) {
      html += '<div class="trow-headline">“' + escapeHtml(t.headline) + '”</div>';
    }
    html += '</div>';
    return html;
  }

  // ---------------- controls ----------------

  function initControls() {
    WINDOWS.forEach(function (w) {
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = w.label;
      btn.dataset.win = w.id;
      btn.addEventListener('click', function () {
        state.window = w.id;
        updateControlsActive();
        render();
      });
      els.windowTabs.appendChild(btn);
    });
    updateControlsActive();

    els.viewMarkets.addEventListener('click', function () {
      state.view = 'markets'; closeDrawer(); updateControlsActive(); render();
    });
    els.viewBooks.addEventListener('click', function () {
      state.view = 'books'; closeDrawer(); updateControlsActive(); render();
    });
  }

  function updateControlsActive() {
    Array.prototype.forEach.call(els.windowTabs.children, function (btn) {
      btn.classList.toggle('active', btn.dataset.win === state.window);
    });
    els.viewMarkets.classList.toggle('active', state.view === 'markets');
    els.viewBooks.classList.toggle('active', state.view === 'books');
  }

  // ---------------- data fetch ----------------

  function fetchData() {
    fetch(RPC_URL, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      state.raw = data;
      var paired = buildTrades(data.events || []);
      state.trades = paired.closed;
      state.openTrades = crossCheckOpen(data.open, paired.open);
      state.lastFetch = Date.now();
      state.fetchFailed = false;
      setLiveStatus(true);
      render();
    }).catch(function (e) {
      state.fetchFailed = true;
      setLiveStatus(false);
      if (window.console) console.error('cryptobot pnl fetch failed', e);
    });
  }

  function setLiveStatus(ok) {
    els.liveDot.classList.toggle('down', !ok);
  }

  function tickUpdatedAgo() {
    if (!state.lastFetch) { els.updatedAgo.textContent = 'connecting…'; return; }
    var secs = Math.max(0, Math.round((Date.now() - state.lastFetch) / 1000));
    var label;
    if (secs < 5) label = 'just now';
    else if (secs < 60) label = secs + 's ago';
    else label = Math.floor(secs / 60) + 'm ago';
    els.updatedAgo.textContent = (state.fetchFailed ? 'connection issue · last update ' : 'updated ') + label;
  }

  // ---------------- paper desk ----------------
  // "I don't want alerts. I want to SEE the trade happening visually, and
  // I want it logged. Basically a copy of what I have on BloFin, just
  // automated." — the internal paper books (tradfi_engine.py's oil/S&P
  // slots + spx_book.py's dedicated S&P dip-buy) rendered as a real
  // trading screen: a candlestick chart with the position drawn on it,
  // a BloFin-style position card with live PnL, and a trade log.

  function fetchPaperData() {
    fetch(LIVE_READ_RPC_URL, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      state.paper = (data && data.paper) || { books: [] };
      state.paperFetchFailed = false;
      renderPaper();
    }).catch(function (e) {
      state.paperFetchFailed = true;
      if (window.console) console.error('cryptobot paper desk fetch failed', e);
    });
  }

  function paperBooksForMarket(market) {
    return (state.paper.books || []).filter(function (b) { return b.market === market; });
  }

  function fmtHeld(openedAtStr) {
    if (!openedAtStr) return '—';
    var opened = Date.parse(openedAtStr.replace(' UTC', 'Z').replace(' ', 'T'));
    if (isNaN(opened)) opened = Date.parse(openedAtStr);
    if (isNaN(opened)) return '—';
    var mins = Math.max(0, Math.round((Date.now() - opened) / 60000));
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h ' + m + 'm';
  }

  function positionPnl(book) {
    var t = book.open;
    if (!t || t.entry == null) return null;
    var mark = (book.last_price && book.last_price.price != null)
      ? book.last_price.price
      : (book.candles && book.candles.length ? book.candles[book.candles.length - 1].c : null);
    if (mark == null) return null;
    var qty = t.contracts_or_notional || 0;
    var dollars = t.side === 'SHORT' ? (t.entry - mark) * qty : (mark - t.entry) * qty;
    var margin = (t.notional && t.leverage) ? (t.notional / t.leverage)
      : (t.notional || (t.entry * qty)) || null;
    var pct = margin ? (dollars / margin) * 100 : null;
    return { mark: mark, dollars: dollars, pct: pct };
  }

  // ---- SVG candlestick chart, BloFin-style position overlay ----

  function buildCandleChartSvg(candles, opens) {
    var W = 900, H = 300, padL = 8, padR = 66, padT = 14, padB = 22;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var n = candles.length;
    if (!n) return '';

    var lo = Infinity, hi = -Infinity;
    candles.forEach(function (c) {
      if (c.l < lo) lo = c.l;
      if (c.h > hi) hi = c.h;
    });
    (opens || []).forEach(function (t) {
      [t.entry, t.stop, t.target].forEach(function (v) {
        if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; }
      });
    });
    if (!isFinite(lo) || !isFinite(hi)) return '';
    if (lo === hi) { lo -= 1; hi += 1; }
    var span = (hi - lo) * 1.08;
    var mid = (hi + lo) / 2;
    lo = mid - span / 2; hi = mid + span / 2;

    function y(v) { return padT + innerH - ((v - lo) / (hi - lo)) * innerH; }
    var slot = innerW / n;
    var bodyW = Math.max(1.5, Math.min(9, slot * 0.62));

    var svg = '<svg class="paper-chart-svg" viewBox="0 0 ' + W + ' ' + H +
      '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">';

    // gridlines (4 horizontal)
    for (var g = 0; g <= 3; g++) {
      var gy = padT + (innerH / 3) * g;
      svg += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + gy.toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
    }

    // candles
    for (var i = 0; i < n; i++) {
      var c = candles[i];
      var cx = padL + slot * i + slot / 2;
      var up = c.c >= c.o;
      var color = up ? '#34d399' : '#f87171';
      var yO = y(c.o), yC = y(c.c), yH = y(c.h), yL = y(c.l);
      svg += '<line x1="' + cx.toFixed(1) + '" y1="' + yH.toFixed(1) + '" x2="' + cx.toFixed(1) +
        '" y2="' + yL.toFixed(1) + '" stroke="' + color + '" stroke-width="1"/>';
      var top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
      svg += '<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + top.toFixed(1) +
        '" width="' + bodyW.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + color + '"/>';
    }

    // position overlay: shaded risk/reward bands + entry/stop/target lines
    (opens || []).forEach(function (t) {
      if (t.entry == null) return;
      var yE = y(t.entry);
      if (t.stop != null) {
        var yS = y(t.stop);
        svg += '<rect x="' + padL + '" y="' + Math.min(yE, yS).toFixed(1) + '" width="' + innerW +
          '" height="' + Math.max(1, Math.abs(yS - yE)).toFixed(1) +
          '" fill="rgba(248,113,113,0.10)"/>';
      }
      if (t.target != null) {
        var yT = y(t.target);
        svg += '<rect x="' + padL + '" y="' + Math.min(yE, yT).toFixed(1) + '" width="' + innerW +
          '" height="' + Math.max(1, Math.abs(yT - yE)).toFixed(1) +
          '" fill="rgba(52,211,153,0.10)"/>';
      }
      function hline(v, color, label) {
        var yy = y(v);
        svg += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) +
          '" y2="' + yy.toFixed(1) + '" stroke="' + color +
          '" stroke-width="1.25" stroke-dasharray="4,3"/>';
        svg += '<rect x="' + (W - padR + 4) + '" y="' + (yy - 8).toFixed(1) +
          '" width="' + (padR - 6) + '" height="16" rx="3" fill="' + color + '"/>';
        svg += '<text x="' + (W - padR + 4 + (padR - 6) / 2) + '" y="' + (yy + 3.5).toFixed(1) +
          '" font-size="10" font-weight="700" text-anchor="middle" fill="#0a0b0f" font-family="inherit">' +
          escapeHtml(label) + '</text>';
      }
      hline(t.entry, 'rgba(238,240,245,0.85)', fmtPrice(t.entry));
      if (t.stop != null) hline(t.stop, '#f87171', fmtPrice(t.stop));
      if (t.target != null) hline(t.target, '#34d399', fmtPrice(t.target));
    });

    svg += '</svg>';
    return svg;
  }

  // ---- position card ----

  function buildPositionCardHtml(book, domIdx) {
    var t = book.open;
    if (!t) {
      return '<div class="paper-flat">flat — waiting for a setup</div>';
    }
    var sideCls = t.side === 'SHORT' ? 'short' : 'long';
    var pnl = positionPnl(book);
    var pnlDollars = pnl ? pnl.dollars : null;
    var pnlPct = pnl ? pnl.pct : null;
    var mark = pnl ? pnl.mark : null;
    var cls = pnlClass(pnlDollars);
    var qty = t.contracts_or_notional;
    return '' +
      '<div class="paper-pos" data-paper-pos="' + domIdx + '">' +
        '<div class="paper-pos-top">' +
          '<span class="paper-pos-side ' + sideCls + '">' + t.side + '</span>' +
          '<span class="paper-pos-held" data-field="held">' + fmtHeld(t.opened_at) + '</span>' +
        '</div>' +
        '<div class="paper-pos-pnl tabular ' + cls + '" data-field="pnl">' +
          (pnlDollars == null ? '—' : fmtMoney(pnlDollars)) + '</div>' +
        '<div class="paper-pos-pnlpct tabular ' + cls + '" data-field="pnlpct">' +
          (pnlPct == null ? '' : (pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(2) + '% of margin') + '</div>' +
        '<div class="paper-pos-grid">' +
          '<div><div class="lbl">Entry</div><div class="v tabular">' + fmtPrice(t.entry) + '</div></div>' +
          '<div><div class="lbl">Mark</div><div class="v tabular" data-field="mark">' + fmtPrice(mark) + '</div></div>' +
          '<div><div class="lbl">Stop</div><div class="v stop tabular">' + (t.stop == null ? '— (signal exit)' : fmtPrice(t.stop)) + '</div></div>' +
          '<div><div class="lbl">Target</div><div class="v target tabular">' + (t.target == null ? '— (signal exit)' : fmtPrice(t.target)) + '</div></div>' +
          '<div><div class="lbl">Size</div><div class="v tabular">' + (qty == null ? '—' : qty.toFixed(2)) + '</div></div>' +
          '<div><div class="lbl">Notional</div><div class="v tabular">' + (t.notional == null ? '—' : fmtMoneyPlain(t.notional)) + '</div></div>' +
        '</div>' +
      '</div>';
  }

  function tickPaperLive() {
    var active = paperBooksForMarket(state.paperMarket);
    active.forEach(function (book, i) {
      var el = document.querySelector('[data-paper-pos="' + i + '"]');
      if (!el || !book.open) return;
      var held = el.querySelector('[data-field="held"]');
      if (held) held.textContent = fmtHeld(book.open.opened_at);
      var pnl = positionPnl(book);
      if (!pnl) return;
      var markEl = el.querySelector('[data-field="mark"]');
      if (markEl) markEl.textContent = fmtPrice(pnl.mark);
      var cls = pnlClass(pnl.dollars);
      var pnlEl = el.querySelector('[data-field="pnl"]');
      if (pnlEl) {
        pnlEl.textContent = fmtMoney(pnl.dollars);
        pnlEl.className = 'paper-pos-pnl tabular ' + cls;
      }
      var pctEl = el.querySelector('[data-field="pnlpct"]');
      if (pctEl && pnl.pct != null) {
        pctEl.textContent = (pnl.pct >= 0 ? '+' : '') + pnl.pct.toFixed(2) + '% of margin';
        pctEl.className = 'paper-pos-pnlpct tabular ' + cls;
      }
    });
  }

  // ---- trade log ----

  function buildTradeLogHtml(book) {
    var rows = book.trades || [];
    if (!rows.length) {
      return '<div class="paper-log-label">Trade log</div><div class="paper-log-empty">no closed trades yet</div>';
    }
    var html = '<div class="paper-log-label">Trade log · last ' + rows.length + '</div><div class="paper-log">';
    rows.forEach(function (t) {
      var sideCls = t.side === 'SHORT' ? 'short' : 'long';
      var priceBit = (t.entry != null && t.exit != null)
        ? (fmtPrice(t.entry) + ' → ' + fmtPrice(t.exit))
        : '—';
      html += '<div class="paper-log-row">' +
        '<span class="paper-log-time">' + escapeHtml(t.closed_date || '—') + '</span>' +
        '<span class="paper-log-side ' + sideCls + '">' + escapeHtml(t.side || '—') + '</span>' +
        '<span class="paper-log-prices">' + priceBit + '</span>' +
        '<span class="paper-log-reason">' + escapeHtml((t.reason || '').replace(/_/g, ' ') || '') + '</span>' +
        '<span class="paper-log-pnl tabular ' + pnlClass(t.pnl) + '">' + (t.pnl == null ? '—' : fmtMoney(t.pnl)) + '</span>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---- assembly ----

  function renderPaper() {
    var books = state.paper.books || [];
    els.paperSection.hidden = books.length === 0;
    if (!books.length) return;

    buildPaperTabsUi();
    var marketBooks = paperBooksForMarket(state.paperMarket);
    if (!marketBooks.length) marketBooks = books;

    var chartBook = marketBooks.filter(function (b) { return b.candles && b.candles.length; })[0];
    var opens = marketBooks.filter(function (b) { return b.open; }).map(function (b) { return b.open; });

    var asOfLabel = '';
    var stale = false;
    if (chartBook && chartBook.last_price) {
      asOfLabel = 'price as of ' + (chartBook.last_price.as_of || '—');
      stale = !!chartBook.last_price.stale;
    }

    var chartHtml;
    if (chartBook && chartBook.candles && chartBook.candles.length) {
      chartHtml = buildCandleChartSvg(chartBook.candles, opens);
    } else {
      chartHtml = '<div class="paper-chart-empty">chart data warming up — check back next publish cycle</div>';
    }

    var html = '<div class="paper-chart-card">' +
      '<div class="paper-chart-head">' +
        '<div class="paper-chart-name">' + escapeHtml(state.paperMarket) + ' · 1h</div>' +
        '<div class="paper-chart-asof' + (stale ? ' stale' : '') + '">' + escapeHtml(asOfLabel) + (stale ? ' (stale)' : '') + '</div>' +
      '</div>' +
      chartHtml +
    '</div>';

    html += '<div class="paper-books-row">';
    marketBooks.forEach(function (book, i) {
      html += '<div class="paper-book-card">' +
        '<div class="paper-book-head">' +
          '<div class="paper-book-name">' + escapeHtml(book.name) + '<span class="tag">paper</span></div>' +
          '<div>' +
            '<div class="paper-book-ledger">ledger <span class="val tabular">' + fmtMoneyPlain(book.ledger_equity) + '</span></div>' +
            '<div class="paper-book-record">' + (book.record ? (book.record.w + 'W / ' + book.record.l + 'L') : '—') +
              ' · today ' + fmtMoney(book.today_pnl) + '</div>' +
          '</div>' +
        '</div>' +
        buildPositionCardHtml(book, i) +
        buildTradeLogHtml(book) +
      '</div>';
    });
    html += '</div>';

    els.paperContent.innerHTML = html;
  }

  function buildPaperTabsUi() {
    var present = {};
    (state.paper.books || []).forEach(function (b) { present[b.market] = true; });
    var markets = PAPER_MARKETS.filter(function (m) { return present[m]; });
    if (markets.indexOf(state.paperMarket) === -1 && markets.length) {
      state.paperMarket = markets[0];
    }
    els.paperTabs.innerHTML = '';
    markets.forEach(function (m) {
      var btn = document.createElement('button');
      btn.className = 'paper-tab' + (m === state.paperMarket ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', function () {
        state.paperMarket = m;
        renderPaper();
      });
      els.paperTabs.appendChild(btn);
    });
  }

  // ---------------- init ----------------

  function cacheEls() {
    els.equity = $('#equity-value');
    els.goalBarFill = $('#goal-bar-fill');
    els.goalText = $('#goal-text');
    els.windowPnlLabel = $('#window-pnl-label');
    els.windowPnl = $('#window-pnl');
    els.windowPnlSub = $('#window-pnl-sub');
    els.sparkline = $('#sparkline');
    els.updatedAgo = $('#updated-ago');
    els.liveDot = $('#live-dot');
    els.windowTabs = $('#window-tabs');
    els.viewMarkets = $('#view-markets');
    els.viewBooks = $('#view-books');
    els.grid = $('#grid');
    els.drawer = $('#drawer');
    els.backdrop = $('#backdrop');
    els.drawerIcon = $('#drawer-icon');
    els.drawerTitle = $('#drawer-title');
    els.drawerSub = $('#drawer-sub');
    els.drawerList = $('#drawer-list');
    els.drawerClose = $('#drawer-close');
    els.paperSection = $('#paper-section');
    els.paperTabs = $('#paper-tabs');
    els.paperContent = $('#paper-content');
  }

  function init() {
    cacheEls();
    initControls();
    els.drawerClose.addEventListener('click', closeDrawer);
    els.backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    window.addEventListener('resize', function () {
      if (state.raw) drawSparkline(closedInWindow());
    });

    fetchData();
    setInterval(fetchData, POLL_MS);
    setInterval(tickUpdatedAgo, 1000);
    tickUpdatedAgo();

    fetchPaperData();
    setInterval(fetchPaperData, POLL_MS);
    setInterval(tickPaperLive, 1000);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
