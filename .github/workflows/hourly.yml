# The cloud brain: one hourly heartbeat that does everything, in order —
# positioning snapshot -> core book (at 4h boundaries) -> tactical book.
# Replaces the separate trade.yml and collect.yml (serialized on purpose:
# two books must never place orders concurrently on one symbol).
#
# Budget: ~1.3 min x 720 runs ≈ 950 of GitHub's 2,000 free monthly minutes.

name: hourly

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: cryptobot-hourly
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: hourly cycle
        env:
          BLOFIN_DEMO_API_KEY: ${{ secrets.BLOFIN_DEMO_API_KEY }}
          BLOFIN_DEMO_API_SECRET: ${{ secrets.BLOFIN_DEMO_API_SECRET }}
          BLOFIN_DEMO_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_PASSPHRASE }}
          CRYPTOBOT_SUPABASE_URL: https://gpgjujfkktxghqeqvrvh.supabase.co
          CRYPTOBOT_SUPABASE_ANON: ${{ secrets.CRYPTOBOT_SUPABASE_ANON }}
          CRYPTOBOT_STATE_SECRET: ${{ secrets.CRYPTOBOT_STATE_SECRET }}
        run: python hourly.py
