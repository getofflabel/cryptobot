# The cloud brain: one hourly heartbeat that does everything, in order —
# positioning snapshot -> core book (at 4h boundaries) -> tactical book.
# Replaces the separate trade.yml and collect.yml (serialized on purpose:
# two books must never place orders concurrently on one symbol).
#
# Budget: ~1.3 min x 720 runs ≈ 950 of GitHub's 2,000 free monthly minutes.

name: hourly

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptobot-hourly
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: claude cli (situation room, news wakes only)
        if: github.event_name == 'workflow_dispatch'
        run: npm install -g @anthropic-ai/claude-code
      - name: hourly cycle
        env:
          BLOFIN_DEMO_API_KEY: ${{ secrets.BLOFIN_DEMO_API_KEY }}
          BLOFIN_DEMO_API_SECRET: ${{ secrets.BLOFIN_DEMO_API_SECRET }}
          BLOFIN_DEMO_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_PASSPHRASE }}
          CRYPTOBOT_SUPABASE_URL: https://gpgjujfkktxghqeqvrvh.supabase.co
          CRYPTOBOT_SUPABASE_ANON: ${{ secrets.CRYPTOBOT_SUPABASE_ANON }}
          CRYPTOBOT_STATE_SECRET: ${{ secrets.CRYPTOBOT_STATE_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python hourly.py
      - name: commit journal
        run: |
          git config user.name "cryptobot"
          git config user.email "bot@cryptobot.local"
          git add data/ledger.csv data/learnings.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "journal update [skip ci]"
          git push || true
