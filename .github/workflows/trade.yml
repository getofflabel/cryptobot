# Runs the bot in GitHub's cloud, every 4 hours, forever.
#
# Why here instead of Render: Render charges for cron jobs. GitHub Actions
# gives private repos 2,000 free minutes a month; this uses about 180. The
# bot is stateless between runs (its ledger lives in Supabase), so a fresh
# container each time is not just fine, it is the cleanest way to run it.

name: cryptobot

on:
  schedule:
    # 7 minutes past each 4h UTC boundary (00/04/08/12/16/20), giving the
    # exchange time to finalize the closing bar before we read it.
    # NOTE: GitHub's scheduler is best-effort and can run late under load.
    # Harmless here: the strategy acts on closed 4h bars, so a few minutes
    # of drift changes nothing.
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:        # lets us trigger a run by hand any time

concurrency:
  # Never let two runs overlap. Two bots deciding at once could double a
  # position. This is the cheapest possible insurance against that.
  group: cryptobot-live
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: one decision cycle
        env:
          BLOFIN_DEMO_API_KEY: ${{ secrets.BLOFIN_DEMO_API_KEY }}
          BLOFIN_DEMO_API_SECRET: ${{ secrets.BLOFIN_DEMO_API_SECRET }}
          BLOFIN_DEMO_PASSPHRASE: ${{ secrets.BLOFIN_DEMO_PASSPHRASE }}
          CRYPTOBOT_SUPABASE_URL: https://gpgjujfkktxghqeqvrvh.supabase.co
          CRYPTOBOT_SUPABASE_ANON: ${{ secrets.CRYPTOBOT_SUPABASE_ANON }}
          CRYPTOBOT_STATE_SECRET: ${{ secrets.CRYPTOBOT_STATE_SECRET }}
        run: python step5_paper_trade.py --once
